    // State
    let currentQuestion = 0;
    let selectedAnswer = null;
    let score = 0;
    let answeredQuestions = [];

    // Initialize
    function init() {
        displayQuestion();
        document.getElementById('restartBtn').addEventListener('click', handleRestart);
    }

    // Display Question
    function displayQuestion() {
        const q = questions[currentQuestion];
        const progress = ((currentQuestion + 1) / questions.length) * 100;

        document.getElementById('chapterName').textContent = q.chapter;
        document.getElementById('question').textContent = q.question;
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        document.getElementById('currentScore').textContent = `${score} / ${answeredQuestions.length}`;

        // Clear and create options
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${option}</span>`;
            btn.onclick = () => handleAnswerClick(index);
            optionsContainer.appendChild(btn);
        });

        // Hide explanation and next button
        document.getElementById('explanationContainer').innerHTML = '';
        document.getElementById('nextBtn').classList.add('hidden');
        selectedAnswer = null;
    }

    // Handle Answer Click
    function handleAnswerClick(index) {
        if (selectedAnswer !== null) return;

        selectedAnswer = index;
        const q = questions[currentQuestion];
        const buttons = document.querySelectorAll('.option-btn');

        // Update buttons
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            if (i === q.correct) {
                btn.classList.add('correct');
                btn.innerHTML += `<svg class="icon-check" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            } else if (i === selectedAnswer) {
                btn.classList.add('incorrect');
                btn.innerHTML += `<svg class="icon-x" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            }
        });

        // Update score
        if (selectedAnswer === q.correct) {
            score++;
        }

        // Show explanation
        const expContainer = document.getElementById('explanationContainer');
        expContainer.className = `explanation ${selectedAnswer === q.correct ? 'correct' : 'info'}`;
        expContainer.innerHTML = `
                <p class="explanation-title">${selectedAnswer === q.correct ? '✓ Correct!' : 'ℹ Explanation:'}</p>
                <p class="explanation-text">${q.explanation}</p>
            `;

        // Show next button
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.classList.remove('hidden');
        if (currentQuestion < questions.length - 1) {
            nextBtn.innerHTML = `Next Question <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
        } else {
            nextBtn.textContent = 'See Results';
        }
        nextBtn.onclick = handleNext;
    }

    // Handle Next
    function handleNext() {
        answeredQuestions.push(currentQuestion);

        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            displayQuestion();
        } else {
            showResults();
        }
    }

    // Show Results
    function showResults() {
        const percentage = ((score / questions.length) * 100).toFixed(1);
        const passed = percentage >= 70;

        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');

        const iconContainer = document.getElementById('resultIcon');
        iconContainer.className = `result-icon ${passed ? 'passed' : 'failed'}`;
        iconContainer.innerHTML = passed
            ? '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>'
            : '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

        document.getElementById('resultTitle').textContent = passed ? 'Congratulations!' : 'Keep Learning!';
        document.getElementById('resultScore').innerHTML = `You scored <span class="highlight">${score}</span> out of <span style="font-weight: bold;">${questions.length}</span>`;
        document.getElementById('resultPercentage').textContent = `${percentage}%`;
        document.getElementById('resultMessage').textContent = passed
            ? 'Excellent work! You have a strong understanding of communication skills.'
            : 'Review the material and try again to improve your score.';
    }

    // Handle Restart
    function handleRestart() {
        currentQuestion = 0;
        selectedAnswer = null;
        score = 0;
        answeredQuestions = [];

        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.remove('hidden');

        displayQuestion();
    }

    // Start quiz
    window.addEventListener('DOMContentLoaded', init);
</script>
