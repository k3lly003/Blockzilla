                if (userSet.size !== correctSet.size) {
                    isCorrect = false;
                } else {
                    for (let val of userSet) {
                        if (!correctSet.has(val)) {
                            isCorrect = false;
                            break;
                        }
                    }
                }

                const optionsInputs = document.getElementsByName('question-' + index);
                optionsInputs.forEach((input) => {
                    const label = input.parentElement;
                    const idx = parseInt(input.value, 10);
                    if (correctSet.has(idx)) {
                        label.classList.add('correct');
                    } else if (userSet.has(idx) && !correctSet.has(idx)) {
                        label.classList.add('incorrect');
                    }
                });

                if (isCorrect && userSet.size > 0) {
                    score++;
                }

                const explanationDiv = document.getElementById('explanation-' + index);
                explanationDiv.classList.add('show');
            });

            const percentage = Math.round((score / totalQuestions) * 100);
            scoreCircle.textContent = percentage + '%';
            correctCountSpan.textContent = score;
            totalQuestionsSpan.textContent = totalQuestions;
            attemptedCountSpan.textContent = attempted;
            scoreCounter.textContent = `Score: ${score}/${totalQuestions}`;
            resultsDiv.style.display = 'block';
            essaySection.style.display = 'block';

            renderEssays();
        }

        function renderEssays() {
            essaySection.innerHTML = '<h2>📝 Written Answer Questions</h2>';
            essayQuestions.forEach((q) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'essay-question';

                const title = document.createElement('h3');
                title.textContent = q.question;

                const answerDiv = document.createElement('div');
                answerDiv.className = 'essay-answer';
                answerDiv.innerHTML = `<h4>Model answer (for revision):</h4>${q.answer}`;

                wrapper.appendChild(title);
                wrapper.appendChild(answerDiv);
                essaySection.appendChild(wrapper);
            });
        }

        function resetQuiz() {
            userAnswers = {};
            score = 0;
            resultsDiv.style.display = 'none';
            essaySection.style.display = 'none';
            renderQuiz();
        }

        submitBtn.addEventListener('click', gradeQuiz);
        resetBtn.addEventListener('click', resetQuiz);

        // initial render
        renderQuiz();
    </script>
</body>

</html>
